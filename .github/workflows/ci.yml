# CI for the portfolio: every push and pull request gets lint, typecheck and the production build.
# The filmed end-to-end suite (`npm test`, Playwright with video) is the local PROVE stage and is not
# run here: it needs Google Chrome and records ~130 videos per run.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
